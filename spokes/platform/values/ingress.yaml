profile: maas
dependencies:
  rhcl:
    # Kuadrant fails open by default (kuadrant-operator internal/wasm/utils.go): with Limitador
    # unreachable, a request passes and its tokens aren't counted. Fail closed, and give Authorino
    # 2s instead of 200ms, as the MaaS install guide recommends (platform-setup.md).
    olm:
      config:
        env:
          - { name: RATELIMIT_CHECK_SERVICE_FAILURE_MODE, value: deny }
          - { name: RATELIMIT_REPORT_SERVICE_FAILURE_MODE, value: deny }
          - { name: AUTH_SERVICE_TIMEOUT, value: 2s }
components:
  dashboard:
    dsc:
      standard: { managementState: Managed }
      maasPortal: { managementState: Managed }
  kserve:
    gateway:
      spec:
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions:
                    - { key: kubernetes.io/metadata.name, operator: In, values: [openshift-ingress, aigrid-models] }
  aigateway:
    modelsAsAService:
      gateway:
        spec:
          # Exposed by an OpenShift Route rather than an AWS load balancer: Policy maas-route creates
          # the parameters ConfigMap (ClusterIP Service), the passthrough Route, the listener's
          # certificate, and the listener host name maas.<apps domain>, looked up on the spoke, so
          # no host name is in git.
          infrastructure:
            parametersRef: { group: "", kind: ConfigMap, name: maas-gateway-options }
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs: [{ group: "", kind: Secret, name: maas-gw-public-tls }]
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      # MaaS models in a grid are ExternalModels pointing at the grid gateway;
                      # aigrid-portal-auth holds the MaaS Portal's sign-in routes (Policy tenant-portal).
                      - { key: kubernetes.io/metadata.name, operator: In, values: [openshift-ingress, models-as-a-service, redhat-ai-gateway-infra, aigrid-portal-auth] }
