apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: ai-grid
  namespace: keycloak
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  keycloakCRName: maas-keycloak
  # DRAFT (step 2): the tenant identity providers' public URL and broker secrets come from Secret
  # ai-grid-tenant-idps (bootstrap/35-keycloak.sh creates it; nothing secret or host-specific in git).
  placeholders:
    KEYCLOAK_PUBLIC_URL: { secret: { name: ai-grid-tenant-idps, key: keycloak-url } }
    ORG1_BROKER_SECRET: { secret: { name: ai-grid-tenant-idps, key: org1-broker-secret } }
    ORG2_BROKER_SECRET: { secret: { name: ai-grid-tenant-idps, key: org2-broker-secret } }
  realm:
    realm: ai-grid
    enabled: true
    organizationsEnabled: true
    # Slow password guessing: after 10 failures a user waits, up to 15 minutes; never locked for good.
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    waitIncrementSeconds: 60
    maxFailureWaitSeconds: 900
    # The broker realm (ODH-ADR-MS-0007, after Lindani Phiri's maas-portal-integration-poc `saas` realm):
    # each organization signs in through its own identity provider, chosen by email domain, and the
    # MaaS claims come from that provider. Fixed IDs, because MaaS requires the claim's organization_id
    # to be a UUID, and the tenant realms (realm-org*-idp.yaml) carry it. PLACEHOLDER names: org1, org2.
    organizations:
      - { id: 6c0e9545-c68e-448e-bd38-a4cca32e963a, name: org1, alias: org1, enabled: true,
          domains: [{ name: org1.example.com }], identityProviders: [{ alias: org1-idp }] }
      - { id: f482cdb6-4658-480b-add6-0464f8d93461, name: org2, alias: org2, enabled: true,
          domains: [{ name: org2.example.com }], identityProviders: [{ alias: org2-idp }] }
    # Each provider joins its organization through the organization's identityProviders list above;
    # an organizationId here fails the import (providers are imported before organizations).
    identityProviders:
      - { alias: org1-idp, displayName: org1, providerId: oidc, enabled: true, hideOnLogin: true, trustEmail: false,
          firstBrokerLoginFlowAlias: ai-grid first broker login,
          config: { clientId: ai-grid-broker, clientSecret: "${ORG1_BROKER_SECRET}", clientAuthMethod: client_secret_post,
            issuer: "${KEYCLOAK_PUBLIC_URL}/realms/org1-idp", authorizationUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org1-idp/protocol/openid-connect/auth",
            tokenUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org1-idp/protocol/openid-connect/token", jwksUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org1-idp/protocol/openid-connect/certs",
            logoutUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org1-idp/protocol/openid-connect/logout", useJwksUrl: "true", validateSignature: "true",
            pkceEnabled: "true", pkceMethod: S256, defaultScope: openid email profile, syncMode: FORCE,
            kc.org.domain: org1.example.com, kc.org.broker.redirect.mode.email-matches: "true" } }
      - { alias: org2-idp, displayName: org2, providerId: oidc, enabled: true, hideOnLogin: true, trustEmail: false,
          firstBrokerLoginFlowAlias: ai-grid first broker login,
          config: { clientId: ai-grid-broker, clientSecret: "${ORG2_BROKER_SECRET}", clientAuthMethod: client_secret_post,
            issuer: "${KEYCLOAK_PUBLIC_URL}/realms/org2-idp", authorizationUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org2-idp/protocol/openid-connect/auth",
            tokenUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org2-idp/protocol/openid-connect/token", jwksUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org2-idp/protocol/openid-connect/certs",
            logoutUrl: "${KEYCLOAK_PUBLIC_URL}/realms/org2-idp/protocol/openid-connect/logout", useJwksUrl: "true", validateSignature: "true",
            pkceEnabled: "true", pkceMethod: S256, defaultScope: openid email profile, syncMode: FORCE,
            kc.org.domain: org2.example.com, kc.org.broker.redirect.mode.email-matches: "true" } }
    # An organization's provider is trusted for who the user is, never for which organization or groups:
    # the broker sets both (a provider could otherwise claim another organization's ID or groups). The
    # organization claim is fixed per provider; each group the provider may send maps to this realm's
    # group <group> under the organization's group <organization id>, and any other group grants nothing.
    # FORCE re-applies them on every sign-in, so removing a user from a group at the provider takes effect
    # at their next sign-in for tokens. MaaS API keys keep the groups they were minted with until they
    # expire or are revoked.
    # The token's groups claim isn't the group's name or path (Keycloak paths start with `/`): each leaf
    # group carries attribute maas_groups, `<organization id>/<group>` (ODH-ADR-MS-0007's canonical form),
    # and scope maas emits the values of the user's groups. Only leaf groups carry it, because a parent
    # group's attributes reach every member of its children. bootstrap/35-keycloak.sh applies the same
    # shape to a realm that already exists.
    groups:
      - { name: "6c0e9545-c68e-448e-bd38-a4cca32e963a", subGroups: [{ name: group1, attributes: { maas_groups: ["6c0e9545-c68e-448e-bd38-a4cca32e963a/group1"] } }] }
      - { name: "f482cdb6-4658-480b-add6-0464f8d93461", subGroups: [{ name: group1, attributes: { maas_groups: ["f482cdb6-4658-480b-add6-0464f8d93461/group1"] } }] }
    identityProviderMappers:
      # Brokered usernames are the provider's alias and its fixed subject (org1-idp.<sub>): MaaS keys
      # users on this name, so it never repeats across organizations and never follows a rename or a
      # reused name at the provider.
      - { name: username, identityProviderAlias: org1-idp, identityProviderMapper: oidc-username-idp-mapper, config: { template: "${ALIAS}.${CLAIM.sub}", syncMode: FORCE } }
      - { name: username, identityProviderAlias: org2-idp, identityProviderMapper: oidc-username-idp-mapper, config: { template: "${ALIAS}.${CLAIM.sub}", syncMode: FORCE } }
      - { name: organization, identityProviderAlias: org1-idp, identityProviderMapper: hardcoded-attribute-idp-mapper,
          config: { attribute: maas_orgs, attribute.value: '[{"organization_id":"6c0e9545-c68e-448e-bd38-a4cca32e963a","organization_name":"org1","roles":["member"]}]', syncMode: FORCE } }
      - { name: group1, identityProviderAlias: org1-idp, identityProviderMapper: oidc-advanced-group-idp-mapper,
          config: { claims: '[{"key":"groups","value":"group1"}]', are.claim.values.regex: "false", group: "/6c0e9545-c68e-448e-bd38-a4cca32e963a/group1", syncMode: FORCE } }
      - { name: organization, identityProviderAlias: org2-idp, identityProviderMapper: hardcoded-attribute-idp-mapper,
          config: { attribute: maas_orgs, attribute.value: '[{"organization_id":"f482cdb6-4658-480b-add6-0464f8d93461","organization_name":"org2","roles":["member"]}]', syncMode: FORCE } }
      - { name: group1, identityProviderAlias: org2-idp, identityProviderMapper: oidc-advanced-group-idp-mapper,
          config: { claims: '[{"key":"groups","value":"group1"}]', are.claim.values.regex: "false", group: "/f482cdb6-4658-480b-add6-0464f8d93461/group1", syncMode: FORCE } }
    # First sign-in through a provider only creates the user and makes them a member of that provider's
    # organization. Keycloak's default flow would show a profile form when an attribute is missing (where
    # the user could type any username) and offer to link an existing account with the same email (which
    # would merge organizations); here a duplicate username or email fails instead.
    authenticationFlows:
      - alias: ai-grid first broker login
        description: Create the brokered user if unique, then add them to the provider's organization
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - { authenticator: idp-create-user-if-unique, requirement: REQUIRED, priority: 10, authenticatorFlow: false, userSetupAllowed: false }
          - { authenticator: idp-add-organization-member, requirement: REQUIRED, priority: 20, authenticatorFlow: false, userSetupAllowed: false }
    clientScopes:
      - name: maas
        protocol: openid-connect
        # Listing clientScopes replaces Keycloak's built-in ones (basic, profile), so this scope also
        # carries sub and preferred_username, which MaaS reads as the user's name.
        protocolMappers:
          - { name: sub, protocol: openid-connect, protocolMapper: oidc-sub-mapper, config: { access.token.claim: "true", introspection.token.claim: "true" } }
          - name: email
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: email, claim.name: email, jsonType.label: String, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: username, claim.name: preferred_username, jsonType.label: String, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: maas_groups, claim.name: groups, jsonType.label: String, multivalued: "true", aggregate.attrs: "true",
              id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
          - name: maas-orgs
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config: { user.attribute: maas_orgs, claim.name: "https://redhat\\.com/maas/orgs", jsonType.label: JSON, id.token.claim: "true", access.token.claim: "true", userinfo.token.claim: "true" }
    defaultDefaultClientScopes: [maas]
    clients:
      # The tenant client: the CLI (password grant) and the MaaS Portal's sign-in proxy (browser flow
      # with PKCE). bootstrap/36-portal-clients.sh adds each ingress spoke's portal callback.
      - { clientId: maas-cli, publicClient: true, directAccessGrantsEnabled: true, standardFlowEnabled: true, defaultClientScopes: [maas],
          attributes: { pkce.code.challenge.method: S256 } }
