apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata: { name: grid-upstream-key, namespace: ai-grid-policies }
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: grid-upstream-key }
        spec:
          severity: low
          object-templates-raw: |
{{`            {{- $s := lookup "v1" "Secret" "models-as-a-service" "grid-maas-upstream" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata: { name: grid-maas-upstream, namespace: models-as-a-service }
                type: Opaque
                data:
                  api-key: '{{ if $s }}{{ index $s.data "api-key" }}{{ else }}{{ randAlphaNum 32 | base64enc }}{{ end }}'`}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: grid-upstream-key, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-ingress }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: grid-upstream-key }]
