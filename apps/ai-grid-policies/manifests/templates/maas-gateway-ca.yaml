apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata: { name: maas-gateway-ca, namespace: ai-grid-policies }
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: maas-gateway-ca }
        spec:
          severity: high
          # MaaS's gateway originates TLS to the grid's consumer gateway, whose certificate the
          # OpenShift service CA signs; the gateway trusts only the system CAs, and this nightly's
          # ExternalProvider has no CA setting. So it gets the system CAs plus the service CA, built
          # here on the spoke and mounted over the proxy's CA file (Policy maas-route's ConfigMap).
          object-templates-raw: |
{{`            {{- $sys := index (lookup "v1" "ConfigMap" "openshift-config-managed" "trusted-ca-bundle").data "ca-bundle.crt" }}
            {{- $svc := index (lookup "v1" "ConfigMap" "openshift-ingress" "openshift-service-ca.crt").data "service-ca.crt" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata: { name: aigrid-gateway-ca-bundle, namespace: openshift-ingress }
                data:
                  ca-bundle.crt: {{ print $sys "\n" $svc | toRawJson }}`}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: maas-gateway-ca, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-ingress }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: maas-gateway-ca }]
