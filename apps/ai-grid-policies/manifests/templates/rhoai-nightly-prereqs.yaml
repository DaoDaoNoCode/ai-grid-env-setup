apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata: { name: rhoai-nightly-prereqs, namespace: ai-grid-policies }
spec:
  remediationAction: enforce
  disabled: false
  {{- if eq .Values.pullSecretMode "policy" }}
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: rhoai-pull-secret
      namespace: ai-grid-policies
      compliance: Compliant
  {{- end }}
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata: { name: rhoai-nightly-prereqs }
        spec:
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ImageDigestMirrorSet
                metadata: { name: aigrid-rhoai-nightly }
                spec:
                  imageDigestMirrors:
                    - { source: registry.redhat.io/rhoai, mirrors: [quay.io/rhoai] }
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: CatalogSource
                metadata: { name: rhoai-catalog-dev, namespace: openshift-marketplace }
                spec:
                  displayName: Red Hat OpenShift AI (nightly)
                  publisher: RHOAI Development Catalog
                  sourceType: grpc
                  image: {{ .Values.catalogImage }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata: { name: rhoai-nightly-prereqs, namespace: ai-grid-policies }
placementRef: { apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ai-grid-spokes }
subjects: [{ apiGroup: policy.open-cluster-management.io, kind: Policy, name: rhoai-nightly-prereqs }]
