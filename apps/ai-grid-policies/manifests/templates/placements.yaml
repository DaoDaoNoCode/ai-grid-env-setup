{{- /* Spokes are ManagedClusters labelled ai-grid/enabled=true; the role label picks ingress or inference work.
       Tolerations keep a briefly unreachable spoke selected, so a network blip removes nothing. */ -}}
{{- range .Values.placementNamespaces }}
{{- $ns := . }}
{{- range $name, $roles := dict "ai-grid-spokes" (list) "ai-grid-ingress" (list "ingress" "combined") "ai-grid-inference" (list "inference" "combined") }}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata: { name: {{ $name }}, namespace: {{ $ns }} }
spec:
  clusterSets: [default]
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels: { ai-grid/enabled: "true" }
          {{- if $roles }}
          matchExpressions: [{ key: ai-grid/role, operator: In, values: [{{ join ", " $roles }}] }]
          {{- end }}
  tolerations:
    - { key: cluster.open-cluster-management.io/unreachable, operator: Exists }
    - { key: cluster.open-cluster-management.io/unavailable, operator: Exists }
{{- end }}
{{- end }}
{{- /* The cross-cluster network (Submariner): the hub's own local-cluster always, since the hub's
       maas-db and grid enrollment are reached through it, plus every grid member, and nothing else:
       a cluster that isn't a member gets no route to them. Predicates are ORed. By name or label
       only: clusterset default also holds clusters that aren't ours. ai-grid/uninstalling keeps a
       spoke on the network while bootstrap/98-uninstall-spoke.sh waits for MaaS's cleanup, which
       revokes API keys in the hub's maas-db through it. ai-grid/network
       keeps a spoke on the network with no AI Grid on it: make spoke-join sets it, so Remove in the
       console doesn't take a spoke off Submariner, and 98-uninstall-spoke.sh removes it unless
       KEEP_PREREQS=1. Submariner is a cluster prerequisite, like the GPU node. */ -}}
{{- define "ai-grid.network-placement" -}}
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata: { name: ai-grid-network, namespace: {{ . }} }
spec:
  clusterSets: [default]
  predicates:
    - requiredClusterSelector: { labelSelector: { matchLabels: { name: local-cluster } } }
    - requiredClusterSelector: { labelSelector: { matchLabels: { ai-grid/enabled: "true" } } }
    - requiredClusterSelector: { labelSelector: { matchLabels: { ai-grid/uninstalling: "true" } } }
    - requiredClusterSelector: { labelSelector: { matchLabels: { ai-grid/network: "true" } } }
  tolerations:
    - { key: cluster.open-cluster-management.io/unreachable, operator: Exists }
    - { key: cluster.open-cluster-management.io/unavailable, operator: Exists }
{{- end }}
{{- range .Values.placementNamespaces }}
---
{{ include "ai-grid.network-placement" . }}
{{- end }}
