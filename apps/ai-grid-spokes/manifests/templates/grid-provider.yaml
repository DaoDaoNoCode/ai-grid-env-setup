# Model spokes: the provider gateway serves grid peers on the site identity and forwards to the
# local model over TLS; its fixed-IP Service comes from spokes/grid/provider.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-grid-provider, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    {{- include "ai-grid-spokes.generators" (list "inference" "combined") | nindent 4 }}
  template:
    metadata: { name: 'grid-provider-{{`{{.name}}`}}' }
    spec:
      project: default
      sources:
        - repoURL: ghcr.io/praxis-proxy/charts
          chart: praxis-gateway
          targetRevision: "{{ .Values.gridVersion }}"
          helm:
            releaseName: grid-provider
            values: |
              image: { repository: ghcr.io/praxis-proxy/grid-gateway, tag: "v{{ .Values.gridVersion }}@{{ required "gridGatewayDigest" .Values.gridGatewayDigest }}" }
              gatewayConfig:
                role: provider
                localSite: {{`{{.name}}`}}
                # The callers present this site's identity: the hub site's leaf certificate on
                # local-cluster (D8), a remote site's own (siteDigests) elsewhere. A site with no
                # digest yet pins 64 zeros, which no certificate matches: closed until committed,
                # whatever the gateway would make of an empty pin.
                peerTrust: { mode: pin, certDigests: ["{{`{{ if eq .name "local-cluster" }}`}}{{ required "hubSiteDigest" .Values.hubSiteDigest }}{{`{{ else }}{{ index (dict`}}{{ range $k, $v := .Values.siteDigests }} "{{ $k }}" "{{ $v }}"{{ end }}{{`) .name | default "`}}{{ repeat 64 "0" }}{{`" }}{{ end }}`}}"{{ include "ai-grid-spokes.callerDigests" . }}] }
                backends:
                  local:
                    endpoint: "{{ .Values.modelBackendIP }}:8000"
                    transport:
                      mode: tls
                      sni: {{ .Values.modelName }}-kserve-workload-svc.aigrid-models.svc
                      ca: { configMap: openshift-service-ca.crt, key: service-ca.crt }
              tls: { enabled: true, existingSecret: grid-site-identity, caSecret: grid-ca }
              port: { containerPort: 8443, name: https }
              service: { type: ClusterIP, port: 8443 }
        - repoURL: {{ required "gitRepo" .Values.gitRepo | quote }}
          targetRevision: {{ required "gitRef" .Values.gitRef | quote }}
          path: spokes/grid/provider
      destination: { server: '{{`{{.server}}`}}', namespace: {{ .Values.gridNs }} }
      syncPolicy:
        automated: { selfHeal: true }
        retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [CreateNamespace=true]
{{- /* An inference site in providerGlobalIPs is called by the consumers of the sites in consumerSites,
       so its provider pins exactly those, as more list items, and no other site: anyone holding
       another site's identity could otherwise call the model past MaaS. local-cluster presents the
       hub site's certificate; a consumer site not yet in siteDigests pins 64 zeros. Nothing when
       providerGlobalIPs is empty. */ -}}
{{- define "ai-grid-spokes.callerDigests" -}}
{{- range $site, $_ := .Values.providerGlobalIPs }}{{`{{ if eq .name "`}}{{ $site }}{{`" }}`}}
{{- range $c := $.Values.consumerSites }}{{ if ne $c $site }}, "{{ if eq $c "local-cluster" }}{{ $.Values.hubSiteDigest }}{{ else }}{{ get $.Values.siteDigests $c | default (repeat 64 "0") }}{{ end }}"{{ end }}{{ end }}{{`{{ end }}`}}
{{- end }}
{{- end }}
