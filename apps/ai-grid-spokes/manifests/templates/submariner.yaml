{{- /* Cross-cluster networking (Submariner with Globalnet): spokes reach each other's exported
       Services as <name>.<namespace>.svc.clusterset.local, whatever their own CIDRs. */ -}}
apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: submariner-broker
  # ACM creates <cluster set>-broker for each ManagedClusterSet; the spokes are in set default.
  namespace: default-broker
  labels: { cluster.open-cluster-management.io/backup: submariner }
spec:
  # Globalnet, because demo clusters share the same default pod and service CIDRs.
  globalnetEnabled: true
  globalnetCIDRRange: 242.0.0.0/8
  defaultGlobalnetClusterSize: 65536
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-submariner, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  # Placement ai-grid-network, not ai-grid-spokes: the hub stays on the network when it leaves the
  # grid. These apps write only to the hub, so the spoke needs no Argo CD cluster Secret.
  # Leaving the network removes it: a remote spoke's app carries the resources finalizer, so when
  # the Placement drops the spoke (Remove in the console), deleting the app deletes its add-on and
  # SubmarinerConfig, and ACM takes Submariner off the spoke. The hub's app has none, so nothing,
  # not even deleting this ApplicationSet, takes the hub off the network.
  templatePatch: |
    metadata:
      finalizers: {{`{{ if eq .clusterName "local-cluster" }}[]{{ else }}[resources-finalizer.argocd.argoproj.io]{{ end }}`}}
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector: { matchLabels: { cluster.open-cluster-management.io/placement: ai-grid-network } }
        requeueAfterSeconds: 60
  template:
    metadata: { name: 'submariner-{{`{{.clusterName}}`}}' }
    spec:
      project: default
      source: { repoURL: {{ required "gitRepo" .Values.gitRepo | quote }}, targetRevision: {{ required "gitRef" .Values.gitRef | quote }}, path: hub/submariner }
      # The hub, into the spoke's cluster namespace.
      destination: { server: https://kubernetes.default.svc, namespace: '{{`{{.clusterName}}`}}' }
      syncPolicy:
        automated: { selfHeal: true, prune: true }
        retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [SkipDryRunOnMissingResource=true]
