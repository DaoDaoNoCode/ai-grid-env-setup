apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: ai-grid-maas-db-replica, namespace: openshift-gitops }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy: { preserveResourcesOnDeletion: true }
  # The replica is a live copy of the hub's maas-db, tenant API-key data included, so it goes with
  # membership: the app carries the resources finalizer, and when the spoke leaves Placement
  # ai-grid-spokes (Remove in the console, or the uninstall) deleting the app deletes the Cluster. A
  # spoke labelled ai-grid/network stays on Submariner, and would otherwise keep streaming from the
  # primary. The next Add rebuilds it from the primary (pg_basebackup). CloudNativePG's operator stays
  # (Delete=false in spokes/maas-db-replica/operator.yaml).
  templatePatch: |
    metadata:
      finalizers: [resources-finalizer.argocd.argoproj.io]
  generators:
    # Remote ingress spokes only: the hub's own local-cluster has the primary.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector: { matchLabels: { cluster.open-cluster-management.io/placement: ai-grid-spokes } }
              requeueAfterSeconds: 60
          - clusters:
              selector:
                matchLabels: { apps.open-cluster-management.io/acm-cluster: "true", name: '{{`{{.clusterName}}`}}' }
                matchExpressions:
                  - { key: ai-grid/role, operator: In, values: [ingress, combined] }
                  - { key: name, operator: NotIn, values: [local-cluster] }
  template:
    metadata: { name: 'maas-db-replica-{{`{{.name}}`}}' }
    spec:
      project: default
      source: { repoURL: {{ required "gitRepo" .Values.gitRepo | quote }}, targetRevision: {{ required "gitRef" .Values.gitRef | quote }}, path: spokes/maas-db-replica }
      destination: { server: '{{`{{.server}}`}}', namespace: maas-db }
      syncPolicy:
        automated: { selfHeal: true, prune: true }
        retry: { limit: -1, refresh: true, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true, ServerSideApply=true]
