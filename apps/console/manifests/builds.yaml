# Fallback (component images/in-cluster): images built on the hub into its internal registry, for work
# not yet published to ghcr.io/ai-grid-cloud. Each builds a pinned commit of main (the console's matches
# kustomization.yaml). Until console #34 and backend #12 merge, main lags the ghcr pins: the fallback
# has no provider-admin gate on the console's API. The nodes are linux/amd64, so the images are too.
# Rebuild after bumping a ref: oc start-build <name> -n ai-grid, then
# oc rollout restart deploy/ai-grid-provider-console -n ai-grid.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: ai-grid-provider-console }
spec: { lookupPolicy: { local: true } }
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: ai-grid-backend }
spec: { lookupPolicy: { local: true } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-provider-console }
spec:
  source: { git: { uri: https://github.com/ai-grid-cloud/ai-grid-provider-console.git, ref: baff2d328d2b2231f8885600ddf7007404e3d404 } }
  strategy: { dockerStrategy: { dockerfilePath: Dockerfile } }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-provider-console:latest" } }
  resources: { requests: { cpu: "1", memory: 2Gi }, limits: { memory: 6Gi } }
  triggers: [{ type: ConfigChange }]
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-backend }
spec:
  source: { git: { uri: https://github.com/ai-grid-cloud/ai-grid-provider-backend.git, ref: a39ddfcc95366f2be60a855351e11cde8ab031cf } }
  strategy:
    dockerStrategy:
      dockerfilePath: Containerfile
      buildArgs:
        - { name: BUILDPLATFORM, value: linux/amd64 }
        - { name: TARGETOS, value: linux }
        - { name: TARGETARCH, value: amd64 }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-backend:latest" } }
  resources: { requests: { cpu: "1", memory: 1Gi }, limits: { memory: 4Gi } }
  triggers: [{ type: ConfigChange }]
---
# Fallback for unmerged branches: binary builds from a local checkout into the same tags, nothing pushed.
#   oc start-build ai-grid-provider-console-local -n ai-grid --from-dir=<console checkout> --follow
#   oc start-build ai-grid-backend-local -n ai-grid --from-dir=<backend checkout> --follow
#   oc rollout restart deploy/ai-grid-provider-console -n ai-grid
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-provider-console-local }
spec:
  source: { type: Binary, binary: {} }
  strategy: { dockerStrategy: { dockerfilePath: Dockerfile } }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-provider-console:latest" } }
  resources: { requests: { cpu: "1", memory: 2Gi }, limits: { memory: 6Gi } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: ai-grid-backend-local }
spec:
  source: { type: Binary, binary: {} }
  strategy:
    dockerStrategy:
      dockerfilePath: Containerfile
      buildArgs:
        - { name: BUILDPLATFORM, value: linux/amd64 }
        - { name: TARGETOS, value: linux }
        - { name: TARGETARCH, value: amd64 }
  output: { to: { kind: ImageStreamTag, name: "ai-grid-backend:latest" } }
  resources: { requests: { cpu: "1", memory: 1Gi }, limits: { memory: 4Gi } }
