apiVersion: v1
kind: Namespace
metadata: { name: maas-db }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-db
  namespace: maas-db
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  # Three instances: a primary and two standbys that CloudNativePG promotes on failure.
  instances: 3
  affinity: { enablePodAntiAffinity: true, topologyKey: kubernetes.io/hostname, podAntiAffinityType: preferred }
  # maas-api's egress NetworkPolicy (maas-api-egress-restrict) allows port 5432 only to pods
  # labelled app=postgres, so the database pods carry that label.
  inheritedMetadata:
    labels: { app: postgres }
  bootstrap: { initdb: { database: maas, owner: maas_api } }
  # Remote spokes connect by the Submariner name; the server certificate names it too.
  certificates:
    serverAltDNSNames: [maas-db-rw.maas-db.svc.clusterset.local]
  storage: { size: 20Gi }
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
---
# Remote ingress spokes reach the primary through Submariner as
# maas-db-rw.maas-db.svc.clusterset.local, and stream from it into their read replica.
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: maas-db-rw
  namespace: maas-db
  annotations: { argocd.argoproj.io/sync-wave: "4" }
---
# Every cluster has the same read endpoint, maas-read-ro.maas-db.svc: on a remote spoke it's its
# replica's own read-only Service; here it points at this cluster's standbys.
apiVersion: v1
kind: Service
metadata:
  name: maas-read-ro
  namespace: maas-db
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  type: ExternalName
  externalName: maas-db-ro.maas-db.svc.cluster.local
---
# maas-db-rw is exported to every cluster in the cluster set, so the namespace admits only:
# its own pods (replication, CloudNativePG's instance manager), maas-api, the CloudNativePG operator
# (instance status), cluster monitoring (metrics), and other clusters' replicas and maas-api, which
# arrive from their Globalnet addresses (242.0.0.0/8, the Broker's range).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-db-ingress
  namespace: maas-db
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: redhat-ai-gateway-infra } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: redhat-ods-applications } }
        - ipBlock: { cidr: 242.0.0.0/8 }
      ports: [{ port: 5432, protocol: TCP }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } } }]
      ports: [{ port: 8000, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openshift-monitoring } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: openshift-user-workload-monitoring } }
      ports: [{ port: 9187, protocol: TCP }]
