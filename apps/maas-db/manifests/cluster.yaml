apiVersion: v1
kind: Namespace
metadata: { name: maas-db }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-db
  namespace: maas-db
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  instances: 1
  # maas-api's egress NetworkPolicy (maas-api-egress-restrict) allows port 5432 only to pods
  # labelled app=postgres, so the database pods carry that label.
  inheritedMetadata:
    labels: { app: postgres }
  bootstrap: { initdb: { database: maas, owner: maas_api } }
  storage: { size: 20Gi }
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
