apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  instanceSize: minimal
  observabilityAddonSpec: {}
  storageConfig:
    metricObjectStorage: { name: thanos-object-storage, key: thanos.yaml }
  advanced:
    # Thanos compact refuses raw retention under 40 hours, the block size at which it downsamples;
    # 24h leaves it in CrashLoopBackOff.
    retentionConfig:
      retentionResolutionRaw: 5d
      retentionResolution5m: 14d
      retentionResolution1h: 30d
    # The default of 6 receive replicas makes node drains hard.
    receive: { replicas: 2 }
  capabilities:
    platform:
      metrics:
        default: { enabled: true }
        ui: { enabled: true }
    userWorkloads:
      metrics:
        default: { enabled: true }
---
# OpenShift AI's metrics, federated from each spoke's data-science-collector (DSCI monitoring,
# spokes/platform/values/common.yaml) by the spokes' metrics collectors. ACM sends it to the spokes
# only once the add-on's ClusterManagementAddOn lists it (Policy rhai-metrics-hub).
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  name: rhai-metrics
  namespace: open-cluster-management-observability
  labels: { app.kubernetes.io/component: user-workload-metrics-collector }
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  jobName: rhai-metrics
  metricsPath: /metrics
  params:
    match[]: ['{__name__=~".*"}']
  # The exporter serves TLS with an OpenShift service CA certificate; every namespace has that CA
  # in ConfigMap openshift-service-ca.crt.
  scheme: HTTPS
  tlsConfig:
    ca: { configMap: { name: openshift-service-ca.crt, key: service-ca.crt } }
    serverName: data-science-collector-prometheus.redhat-ods-monitoring.svc
  staticConfigs:
    - targets: [data-science-collector-prometheus.redhat-ods-monitoring.svc:8889]
