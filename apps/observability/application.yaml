# Fleet metrics: ACM multicluster observability, with Thanos storing into S4, a single-container
# S3 server on the hub (rh-aiservices-bu/s4), so no cloud bucket or ODF is needed.
metadata:
  name: observability
  namespace: openshift-gitops
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management-observability
  syncPolicy:
    automated:
      # Never prune: deleting a file must not delete stored metrics.
      prune: false
      selfHeal: true
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
